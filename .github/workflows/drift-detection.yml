name: "Drift Detection"

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC
  workflow_dispatch:        # Manual trigger

permissions:
  id-token: write
  contents: read
  issues: write

env:
  TF_DIR: terraform
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  detect:
    name: Detect Drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -detailed-exitcode \
            -no-color > plan-output.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Read plan output
        id: plan-output
        run: |
          if [ -f terraform/plan-output.txt ]; then
            echo "Plan output exceeds 60000 chars, truncating..."
            content=$(head -c 60000 terraform/plan-output.txt)
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "$content" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Create drift issue if detected
        if: steps.plan.outputs.exitcode == '2' || steps.plan.outputs.exitcode == ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const exitCode = '${{ steps.plan.outputs.exitcode }}';
            const title = exitCode === '2'
              ? 'Drift detected in Terraform infrastructure'
              : 'Terraform plan failed';

            const body = `## ${title}

            **Detected:** $(date -u)

            ### Details

            This workflow ran a scheduled \`terraform plan\` and ${
              exitCode === '2'
                ? 'found changes between the deployed infrastructure and the committed configuration.'
                : 'failed to complete. Check the workflow run logs for details.'
            }

            ${exitCode === '2' ? '### Plan output\n\n```\n${{ steps.plan-output.outputs.result }}\n```' : ''}

            ### Next steps

            1. Review the changes in the workflow run logs.
            2. Update \`terraform/\` files to match actual infrastructure, or apply the changes.
            3. Close this issue when drift is resolved.

            ---
            *Automated drift detection — generated by \`.github/workflows/drift-detection.yml\`
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['drift', 'automated']
            });

      - name: Clean plan output
        if: always()
        run: rm -f terraform/plan-output.txt
