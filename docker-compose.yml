services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        COMMIT_SHA: local-dev
        BUILD_DATE: "${BUILD_DATE:-unknown}"
    container_name: cicd-pipeline-dev
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - CORS_ORIGIN=*
    volumes:
      - ./src:/app/src:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
